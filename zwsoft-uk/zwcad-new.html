    <style id="zw-reset-body">
      body { background: #fff !important; color: #111 !important; }

    <style>
      main#content {
        padding-top: calc(var(--header-h, 120px) + 8px);
      }
      .da-main {
        margin-top: 0 !important;
        padding-top: 48px !important;
      }
      @media (max-width: 768px) {
        .da-main {
          padding-top: 32px !important;
        }
      }
      footer {
        background: #1a1a2e;
        color: #fff;
        padding: 4rem 0 2rem;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      footer .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
      }
      .footer-content {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr;
        gap: 3rem;
        margin-bottom: 3rem;
      }
      .footer-brand h3 {
        font-size: 2rem;
        margin-bottom: 1rem;
        font-family: "JetBrains Mono", monospace;
        background: linear-gradient(135deg, #3b82f6, #06b6d4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .footer-brand p {
        color: #94a3b8;
        line-height: 1.8;
      }
      .footer-links h4 {
        margin-bottom: 1.5rem;
        font-size: 1.1rem;
        color: #f8fafc;
      }
      .footer-links ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .footer-links a {
        color: #94a3b8;
        text-decoration: none;
        display: block;
        padding: 0.5rem 0;
        transition: 0.3s;
      }
      .footer-links a:hover {
        color: #67e8f9;
        transform: translateX(5px);
      }
      .footer-bottom {
        text-align: center;
        padding-top: 2rem;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        color: #94a3b8;
      }
      @media (max-width: 768px) {
        .footer-content {
          grid-template-columns: 1fr;
          text-align: center;
          gap: 2rem;
        }
        .footer-content > div:not(:first-child) {
          margin-top: 1rem;
        }
      }
      /* New section styles */
      .zw-hero {
        background: linear-gradient(135deg, #0b1c2d, #0f2a3f);
        color: #fff;
        padding: 100px 6vw 80px;
        position: relative;
        overflow: hidden;
      }
      .zw-hero .container {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 60px;
        align-items: center;
      }
      .zw-hero-content h1 {
        font-size: 48px;
        line-height: 1.2;
        margin-bottom: 20px;
        font-weight: 800;
      }
      .zw-hero-content .lead {
        font-size: 20px;
        color: #b0c4de;
        margin-bottom: 30px;
        line-height: 1.6;
      }
      .zw-hero-cta {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .btn-primary, .btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 16px 28px;
        border-radius: 10px;
        font-weight: 700;
        text-decoration: none;
        transition: all 0.2s ease;
      }
      .btn-primary {
        background: linear-gradient(135deg, #1ba3ff, #12c6ff);
        color: #fff;
        box-shadow: 0 10px 28px rgba(18, 198, 255, 0.32);
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 32px rgba(18, 198, 255, 0.4);
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .zw-hero-visual img {
        width: 100%;
        border-radius: 16px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
      }
      @media (max-width: 1024px) {
        .zw-hero .container {
          grid-template-columns: 1fr;
          gap: 40px;
        }
        .zw-hero-content h1 {
          font-size: 40px;
        }
      }
      @media (max-width: 640px) {
        .zw-hero {
          padding: 80px 5vw 60px;
        }
        .zw-hero-content h1 {
          font-size: 32px;
        }
        .zw-hero-content .lead {
          font-size: 18px;
        }
        .zw-hero-cta {
          flex-direction: column;
        }
      }
      .zw-section {
        padding: 80px 6vw;
      }
      .zw-section.light {
        background: #f6f8fb;
      }
      .zw-section.dark {
        background: linear-gradient(135deg, #0b1c2d, #0f2a3f);
        color: #e7f1ff;
      }
      .zw-section .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      .section-header {
        text-align: center;
        margin-bottom: 60px;
      }
      .section-header h2 {
        font-size: 36px;
        margin-bottom: 16px;
      }
      .section-header p {
        font-size: 18px;
        color: #4b5563;
        max-width: 800px;
        margin: 0 auto;
      }
      .dark .section-header p {
        color: rgba(231, 241, 255, 0.8);
      }
      .value-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 24px;
      }
      .value-card {
        background: #fff;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.08);
        transition: transform 0.2s ease;
      }
      .value-card:hover {
        transform: translateY(-5px);
      }
      .value-card .icon {
        width: 64px;
        height: 64px;
        border-radius: 12px;
        background: linear-gradient(135deg, #1ba3ff, #12c6ff);
        display: grid;
        place-items: center;
        margin-bottom: 20px;
        color: #fff;
        font-size: 28px;
      }
      .value-card h3 {
        font-size: 22px;
        margin-bottom: 12px;
      }
      .value-card p {
        color: #4b5563;
        line-height: 1.6;
      }
      .dark .value-card {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(4px);
      }
      .dark .value-card p {
        color: rgba(231, 241, 255, 0.86);
      }
      .feature-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 24px;
      }
      .feature-item {
        background: #fff;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        border: 1px solid #e5e7eb;
      }
      .feature-item h4 {
        font-size: 18px;
        margin-bottom: 8px;
      }
      .feature-item p {
        color: #4b5563;
        font-size: 15px;
        line-height: 1.5;
      }
      .dark .feature-item {
        background: rgba(255, 255, 255, 0.04);
        border-color: rgba(255, 255, 255, 0.12);
      }
      .dark .feature-item p {
        color: rgba(231, 241, 255, 0.8);
      }
      .cta-block {
        text-align: center;
        padding: 80px 6vw;
        background: linear-gradient(135deg, #0b1c2d, #0f2a3f);
        color: #fff;
      }
      .cta-block h2 {
        font-size: 36px;
        margin-bottom: 20px;
      }
      .cta-block p {
        font-size: 18px;
        color: rgba(255, 255, 255, 0.8);
        max-width: 700px;
        margin: 0 auto 40px;
      }
      .cta-buttons {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
      }
      @media (max-width: 768px) {
        .zw-section {
          padding: 60px 5vw;
        }
        .section-header h2 {
          font-size: 30px;
        }
        .value-cards, .feature-grid {
          grid-template-columns: 1fr;
        }
        .cta-block {
          padding: 60px 5vw;
        }
        .cta-block h2 {
          font-size: 30px;
        }
      }
    </style>
