name: Build and Deploy Software Site

on:
  workflow_dispatch:

jobs:
  deploy-software:
    name: Build standalone software site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.150.0"
          extended: true

      - name: Build software site
        run: hugo --gc --minify --source sites/software --destination ../../public-software -b "${SOFTWARE_BASE_URL:-https://software.cygnas.co.uk}"

      - name: Deploy software site to Lightsail
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: -az --delete
          path: public-software/
          remote_path: ${{ secrets.SOFTWARE_REMOTE_PATH }}
          remote_host: ${{ secrets.LIGHTSAIL_HOST }}
          remote_user: ${{ secrets.LIGHTSAIL_USER }}
          remote_key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
