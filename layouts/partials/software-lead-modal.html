<div class="software-lead-modal" id="softwareLeadModal" hidden aria-hidden="true">
  <div class="software-lead-backdrop" data-software-modal-close></div>
  <div
    class="software-lead-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="softwareLeadModalTitle"
  >
    <button
      class="software-lead-close"
      type="button"
      aria-label="Close enquiry form"
      data-software-modal-close
    >
      <i class="ti ti-x"></i>
    </button>

    <div class="software-lead-copy">
      <p class="software-kicker">Cygnas Software</p>
      <h2 id="softwareLeadModalTitle">Talk to Cygnas Software</h2>
      <p>
        Share what you are evaluating and the team will route your enquiry to
        the right CAD, CAM, AI workflow, or implementation discussion.
      </p>
    </div>

    <form id="contactForm" class="software-lead-form">
      <input type="hidden" name="site" value="Cygnas Software" />
      <input type="hidden" name="source" id="softwareLeadSource" value="Software website" />
      <input type="hidden" name="page_url" id="softwareLeadPageUrl" value="" />

      <div class="software-form-row">
        <div class="software-form-group">
          <label for="softwareLeadName">Your Name *</label>
          <input
            class="form-control"
            type="text"
            id="softwareLeadName"
            name="name"
            autocomplete="name"
            required
          />
        </div>
        <div class="software-form-group">
          <label for="softwareLeadEmail">Email Address *</label>
          <input
            class="form-control"
            type="email"
            id="softwareLeadEmail"
            name="email"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <div class="software-form-row">
        <div class="software-form-group">
          <label for="softwareLeadCompany">Company</label>
          <input
            class="form-control"
            type="text"
            id="softwareLeadCompany"
            name="company"
            autocomplete="organization"
          />
        </div>
        <div class="software-form-group">
          <label for="softwareLeadPhone">Phone</label>
          <input
            class="form-control"
            type="tel"
            id="softwareLeadPhone"
            name="phone"
            autocomplete="tel"
          />
        </div>
      </div>

      <div class="software-form-group">
        <label for="softwareLeadService">Software Interest *</label>
        <select class="form-control" id="softwareLeadService" name="service" required>
          <option value="">Select an option</option>
          <option value="Workflow Consultation">Workflow Consultation</option>
          <option value="ZWCAD">ZWCAD</option>
          <option value="ZWCAD 2027">ZWCAD 2027</option>
          <option value="ZW3D">ZW3D</option>
          <option value="Cosmon Nexus">Cosmon Nexus</option>
          <option value="Product Information">Product Information</option>
          <option value="Demo Request">Demo Request</option>
          <option value="Pricing Request">Pricing Request</option>
        </select>
      </div>

      <div class="software-form-group">
        <label for="softwareLeadMessage">Engineering Workflow Details *</label>
        <textarea
          class="form-control"
          id="softwareLeadMessage"
          name="message"
          rows="4"
          required
          placeholder="Tell us which software, workflow, team size, or implementation question you want to discuss."
        ></textarea>
      </div>

      <button type="submit" class="form-submit software-form-submit" id="submitBtn">
        <i class="ti ti-send"></i> Send Enquiry
      </button>
      <div class="form-message" id="formMessage"></div>
    </form>
  </div>
</div>
