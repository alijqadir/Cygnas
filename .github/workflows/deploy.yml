name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "repo/content/**"
      - "repo/layouts/**"
      - "repo/static/**"
      - "repo/assets/**"
      - "repo/zwsoft-uk/**"
      - "repo/archetypes/**"
      - "repo/hugo.toml"
      - "repo/netlify.hugo.toml"
      - "repo/config.*"
      - "repo/package.json"
      - "repo/package-lock.json"
  workflow_dispatch:

jobs:
  deploy:
    name: Build Hugo site and deploy to Hostinger
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: repo/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.150.0"
          extended: true

      - name: Build site
        run: hugo --gc --minify -b https://www.cygnas.co.uk

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to Hostinger via FTP
        run: |
          lftp -c "
            set ftp:ssl-allow no
            set net:timeout 60
            set net:max-retries 3
            open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }} ${{ secrets.FTP_HOST }}
            mirror -R --delete --verbose public/ /
            quit
          "
